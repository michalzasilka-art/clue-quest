<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1030">
<title>Clue Quest · Fugio</title>
<meta name="description" content="Clue Quest: a pixel-art word game for the whole class. The teacher shows a clue on the big screen, students pick the word on their phones.">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="clue.css?v=14">
<script src="lib/qrcode.js"></script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main id="app"></main>
<noscript>Clue Quest needs JavaScript.</noscript>
<script type="module">
  // /clue/host (or ?host) is the teacher's big screen; /clue/ (and the QR code, /clue/?code=123456) is a student's phone
  const host = /\/host(\.html)?\/?$/.test(location.pathname) || new URLSearchParams(location.search).has('host');
  document.body.classList.add(host ? 'is-host' : 'is-player');
  import(host ? './host.js?v=13' : './play.js?v=12');
</script>
</body>
</html>
